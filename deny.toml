# Supply-chain policy, enforced on every pull request by the "Supply chain" check.
# Run locally with `cargo deny check` (install: `cargo install --locked cargo-deny`).

[graph]
# The desktop app ships for Windows; the portable crates also build on Linux CI.
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]
all-features = true

[advisories]
# Known vulnerabilities always fail. Unsound code fails too; unmaintained crates fail only
# when this workspace depends on them directly.
unmaintained = "workspace"
unsound = "all"
yanked = "deny"
ignore = [
    # glib 0.18 (unsound VariantStrIter) is only in Tauri's Linux GTK stack; OpenKeet ships for
    # Windows and no Windows build contains it. Drop this once Tauri moves to glib >= 0.20.
    { id = "RUSTSEC-2024-0429", reason = "Linux-only Tauri dependency; not in any shipped build" },
]

[licenses]
# Permissive licenses plus MPL-2.0 (file-level copyleft). No GPL or LGPL-only code.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "bzip2-1.0.6",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93

[bans]
# The Tauri and Windows ecosystems pull several versions of some crates; review, don't block.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
