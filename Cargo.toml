[workspace]
members = ["crates/copilot-core", "crates/copilot-audio", "apps/cli"]
default-members = ["crates/copilot-core", "apps/cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
copilot-core = { path = "crates/copilot-core" }
copilot-audio = { path = "crates/copilot-audio" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
