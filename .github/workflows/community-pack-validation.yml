name: Validate community packs

on:
  pull_request:
    paths:
      - .github/workflows/community-pack-validation.yml
      - apps/cli/src/**
      - community-packs/**
      - schemas/**
      - crates/copilot-core/src/prep/**
      - crates/copilot-core/tests/prep.rs
      - Cargo.lock
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable run --locked -p copilot -- validate-packs community-packs/examples
      - run: cargo +stable test --locked -p copilot-core --test prep
