name: Validate community packs

on:
  pull_request:
    paths:
      - .github/workflows/community-pack-validation.yml
      - apps/cli/src/**
      - community-packs/**
      - schemas/**
      - crates/copilot-core/src/prep/**
      - crates/copilot-core/tests/prep.rs
      - Cargo.lock
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Community packs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable run --locked -p copilot -- validate-packs community-packs/examples
      - run: cargo +stable test --locked -p copilot-core --test prep
