name: Release Windows build

# Each merge to main that changes more than docs publishes the next version, v<major>.<minor>,
# with the installer, its checksum and notes generated from the merged PRs.
# A PR title containing [major] bumps the major version and resets the minor to 0; every other
# merge bumps the minor. setup/README.md links to releases/latest, so no commit to main is needed.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write # create the tag and release
    # No build caches: a published installer must not depend on cache entries other runs wrote.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags and PR titles since the last release decide the version
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: rustup toolchain install stable --profile minimal
      - name: Locate libclang for whisper-rs
        shell: pwsh
        run: |
          $clang = (Get-Command clang.exe -ErrorAction Stop).Source | Split-Path -Parent
          if (-not (Test-Path (Join-Path $clang 'libclang.dll'))) { throw 'libclang.dll is missing' }
          "LIBCLANG_PATH=$clang" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      # sherpa-onnx-sys downloads this archive with no retry; the bundle also needs its DLLs
      # extracted before tauri-build copies resources.
      - name: Fetch the pinned speech runtime
        shell: pwsh
        env:
          ARCHIVE: sherpa-onnx-v2.0.1-win-x64-shared-MT-Release-lib.tar.bz2
          SHA256: afa4de3ca4ab0afd53bb4aab40d28ee15608364b549ffc0fe0caf6489bfc39a5
        run: |
          $dir = New-Item -ItemType Directory -Force -Path target/sherpa-onnx-prebuilt
          $file = Join-Path $dir $env:ARCHIVE
          curl.exe --fail --location --silent --show-error --retry 5 --retry-all-errors --retry-delay 10 `
            --output $file "https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/$env:ARCHIVE"
          $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:SHA256) { throw "Unexpected sherpa-onnx archive checksum: $hash" }
          tar -xf $file -C $dir
          if ($LASTEXITCODE) { throw "Could not extract $env:ARCHIVE" }
      - name: Choose the next version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          # The newest release of any kind bounds the merged PRs this release covers.
          $start = gh release list --limit 1 --exclude-drafts --json tagName --jq '.[0].tagName'
          $current = git tag --list 'v*' | Where-Object { $_ -match '^v\d+\.\d+$' } |
            ForEach-Object { [version]$_.Substring(1) } | Sort-Object -Descending | Select-Object -First 1
          if (-not $current) { $current = [version](Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version }
          # Squash merges keep the PR title as the commit subject.
          $titles = @(git log --format=%s $(if ($start) { "$start..HEAD" } else { 'HEAD' }))
          $next = if ($titles -match '\[major\]') { "$($current.Major + 1).0" } else { "$($current.Major).$($current.Minor + 1)" }
          "version=$next", "start=$start" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          # Windows packaging needs three parts, so the installer reports <major>.<minor>.0.
          @{ version = "$next.0" } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP version.json) -Encoding utf8
      - name: Build the installer
        working-directory: apps/desktop
        run: |
          npm ci --ignore-scripts --no-audit
          npm run desktop -- build --ci --config "$env:RUNNER_TEMP/version.json" -- --locked
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
          START: ${{ steps.version.outputs.start }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $range = if ($env:START) { @('--notes-start-tag', $env:START) } else { @() }
          # A fixed asset name keeps the releases/latest/download links on the setup page valid.
          $dir = New-Item -ItemType Directory -Force -Path (Join-Path $env:RUNNER_TEMP release)
          $installer = Join-Path $dir OpenKeet_x64-setup.exe
          Copy-Item -LiteralPath "target/release/bundle/nsis/OpenKeet_$($env:VERSION).0_x64-setup.exe" -Destination $installer
          $digest = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  OpenKeet_x64-setup.exe" | Set-Content -LiteralPath "$installer.sha256" -Encoding ascii
          $notes = Join-Path $dir notes.md
          @'
          Unsigned build of OpenKeet {0} for Windows 11 x64, published automatically from {1}.

          1. Download **OpenKeet_x64-setup.exe** from Assets.
          2. In PowerShell, from the download folder, check the file. It prints `True` when the download is intact:
             ```powershell
             (Get-FileHash .\OpenKeet_x64-setup.exe).Hash -eq '{2}'
             ```
          3. Run setup and open **OpenKeet** from Start. Setup downloads Microsoft Edge WebView2 if it is missing. [First run](https://github.com/{3}/blob/main/docs/getting-started.md#download-and-install)

          '@ -f $env:VERSION, $env:GITHUB_SHA, $digest, $env:GITHUB_REPOSITORY | Set-Content -LiteralPath $notes -Encoding utf8

          gh release create "v$env:VERSION" $installer "$installer.sha256" --target $env:GITHUB_SHA `
            --title "OpenKeet $env:VERSION for Windows" --notes-file $notes --generate-notes @range --latest
