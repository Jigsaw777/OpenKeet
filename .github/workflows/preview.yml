name: Verify desktop preview

on:
  workflow_dispatch:
    inputs:
      native_smoke:
        description: Run the installer and WebView2 smoke on a Windows runner with an audio endpoint
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Portable crates (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup update stable
      - run: rustup component add rustfmt clippy --toolchain stable
      - run: cargo +stable fmt --all --check
      - run: cargo +stable clippy --locked -p copilot-core -p copilot --all-targets -- -D warnings
      - run: cargo +stable test --locked -p copilot-core -p copilot

  windows-desktop:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: rustup update stable
      - run: rustup component add clippy --toolchain stable
      - name: Verify CMake and libclang
        shell: pwsh
        run: |
          cmake --version
          $clang = (Get-Command clang.exe -ErrorAction Stop).Source | Split-Path -Parent
          if (-not (Test-Path (Join-Path $clang 'libclang.dll'))) { throw 'libclang.dll is missing' }
          "LIBCLANG_PATH=$clang" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - working-directory: apps/desktop
        run: npm ci
      - working-directory: apps/desktop
        run: npm test
      - working-directory: apps/desktop
        run: npm run build
      - run: cargo +stable clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo +stable test --workspace --all-features --locked
      - working-directory: apps/desktop
        run: npm run desktop -- build --ci -- --locked
      - name: Verify the temporary Windows installation
        if: inputs.native_smoke
        shell: pwsh
        run: ./apps/desktop/tests/installer-smoke.ps1
      - name: Checksum Windows installer
        shell: pwsh
        run: |
          $installers = Get-ChildItem target/release/bundle/nsis -Filter '*.exe'
          if (!$installers) { throw 'No installer built' }
          foreach ($installer in $installers) {
            $digest = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$digest  $($installer.Name)" | Set-Content -LiteralPath "$($installer.FullName).sha256" -Encoding ascii
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-preview
          path: target/release/bundle/nsis/
          if-no-files-found: error
          retention-days: 7

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: cargo install cargo-audit --locked
      - run: cargo audit
      - working-directory: apps/desktop
        run: npm audit --omit=dev
