name: Feature request
description: Suggest a way to improve interview preparation or the OpenKeet app
title: "[Idea] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve for you?
      description: Tell us what you were trying to do and where you got stuck. Use synthetic examples.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What would a better experience look like?
      description: Describe the outcome you want. A proposed design is optional.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried so far?
      description: Keep account details, transcripts, and credentials private.
